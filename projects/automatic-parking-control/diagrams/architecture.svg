<text x="752.0" y="153" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#526782" font-weight="400">USART1</text>
<text x="752.0" y="179" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#526782" font-weight="400">115200 / 8N1</text>
</g>
<g data-edge-label="true"><rect x="1116" y="367" width="108" height="29" rx="5" fill="#f5f8fc"/>
<text x="1170.0" y="387" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#526782" font-weight="400">GPIO 输出</text>
</g>
<g data-edge-label="true"><rect x="310" y="495" width="92" height="29" rx="5" fill="#f5f8fc"/>
<text x="356.0" y="515" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#526782" font-weight="400">GPIO</text>
</g>
<g data-edge-label="true"><rect x="465" y="340" width="260" height="64" rx="5" fill="#f5f8fc"/>
<text x="595.0" y="360" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#526782" font-weight="400">SPI2 · 单字节位置事件</text>
<text x="595.0" y="386" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#526782" font-weight="400">采集板 → 执行控制板</text>
</g>
<path d="M52 646 H1228" fill="none" stroke="#d6e0ed"/>
<text x="52" y="674" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">4 个车位 · 8 条存取命令 + 停止 / 回零命令入口</text>
<text x="52" y="703" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">SPI 主从由初始化代码确定；此图不将控制原型表述为已验证的实机闭环。</text>
</svg>