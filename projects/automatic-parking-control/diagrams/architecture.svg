<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="自动存取车 · 双 STM32 控制架构">
<rect width="1280" height="760" fill="#f5f8fc"/>
<text x="52" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" text-anchor="start" fill="#18324e" font-weight="700">自动存取车 · 双 STM32 控制架构</text>
<text x="52" y="88" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">应用源码中的指令入口、执行输出与限位事件反馈</text>
<g data-node="app"><rect x="52" y="145" width="240" height="132" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="172.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">手机 App</text>
<text x="172.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">App Inventor / Socket</text>
<text x="172.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">存车 / 取车 / 停止 / 回零</text>
</g>
<g data-node="esp"><rect x="422" y="145" width="250" height="132" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="547.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">ESP-01S</text>
<text x="547.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">AP 模式 / TCP 8080</text>
<text x="547.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">接收手机指令</text>
</g>
<g data-node="controller"><rect x="832" y="145" width="396" height="156" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1030.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">执行控制板 · STM32F103C8</text>
<text x="1030.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">命令解析 / 动作状态机 / OLED</text>
<text x="1030.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">SPI 从设备：接收位置事件</text>
</g>
<g data-node="switches"><rect x="52" y="472" width="240" height="132" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="172.0" y="507" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">14 路限位开关</text>
<text x="172.0" y="537" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">两端限位 + 中间限位</text>
<text x="172.0" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">GPIO 上拉输入</text>
</g>
<g data-node="sampler"><rect x="422" y="472" width="250" height="132" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="547.0" y="507" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">限位采集板</text>
<text x="547.0" y="537" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">STM32F103C8</text>
<text x="547.0" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">SPI 主设备：发送事件</text>
</g>
<g data-node="motors"><rect x="832" y="472" width="396" height="132" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1030.0" y="507" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">6 路电机控制接口</text>
<text x="1030.0" y="537" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">每路：方向 × 2 + 使能</text>
<text x="1030.0" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">配套驱动：L298N</text>
</g>
