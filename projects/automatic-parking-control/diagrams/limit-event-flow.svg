<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="限位事件 · 从采集到动作调度">
<rect width="1200" height="900" fill="#f5f8fc"/>
<text x="52" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" text-anchor="start" fill="#18324e" font-weight="700">限位事件 · 从采集到动作调度</text>
<text x="52" y="88" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">按 01 → 08 顺序阅读；不扩画源码中尚未接通的自动回程</text>
<g data-node="left0"><rect x="60" y="140" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="260.0" y="175" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">01 · 逐路读取 GPIO</text>
<text x="260.0" y="205" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">扫描 14 路输入</text>
<text x="260.0" y="232" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">GetKeyState(i)</text>
</g>
<g data-node="left1"><rect x="60" y="310" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="260.0" y="345" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">02 · 连续确认变化</text>
<text x="260.0" y="375" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">变化连续确认 5 次</text>
<text x="260.0" y="402" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">debounce_count / last_state</text>
</g>
<g data-node="left2"><rect x="60" y="480" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="260.0" y="515" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">03 · 确认低电平事件</text>
<text x="260.0" y="545" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">释放仅更新状态</text>
<text x="260.0" y="572" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">不发送释放事件</text>
</g>
<g data-node="left3"><rect x="60" y="650" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="260.0" y="685" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">04 · 映射并发送事件</text>
<text x="260.0" y="715" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">SendKeyCommand(i)</text>
<text x="260.0" y="742" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">单字节事件码 / SPI2</text>
</g>
<g data-node="right0"><rect x="740" y="140" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="940.0" y="175" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">08 · 电机输出与状态切换</text>
<text x="940.0" y="205" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">执行方向 / 使能操作</text>
<text x="940.0" y="232" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">转入下一动作状态</text>
</g>
<g data-node="right1"><rect x="740" y="310" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="940.0" y="345" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">07 · 主循环动作调度</text>
<text x="940.0" y="375" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">process_action()</text>
<text x="940.0" y="402" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">按动作状态检查位置标志</text>
</g>
<g data-node="right2"><rect x="740" y="480" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="940.0" y="515" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">06 · 更新电机位置标志</text>
<text x="940.0" y="545" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">motor_positions[1..6]</text>
<text x="940.0" y="572" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">0 原点 / 1 终点 / 2 中间位置</text>
</g>
<g data-node="right3"><rect x="740" y="650" width="400" height="112" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="940.0" y="685" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">05 · 控制板接收中断</text>
<text x="940.0" y="715" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">SPI2 接收单字节事件</text>
<text x="940.0" y="742" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">OLED 显示及阻塞延时</text>
</g>
<g data-edge="left-down0"><polyline points="260,260 260.0,291.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="260,302 255,291 265,291" fill="#526782"/></g>
<g data-edge="right-up0"><polyline points="940,302 940.0,271.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="940,260 935,271 945,271" fill="#526782"/></g>
<g data-edge="left-down1"><polyline points="260,430 260.0,461.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="260,472 255,461 265,461" fill="#526782"/></g>
<g data-edge="right-up1"><polyline points="940,472 940.0,441.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="940,430 935,441 945,441" fill="#526782"/></g>
<g data-edge="left-down2"><polyline points="260,600 260.0,631.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="260,642 255,631 265,631" fill="#526782"/></g>
<g data-edge="right-up2"><polyline points="940,642 940.0,611.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="940,600 935,611 945,611" fill="#526782"/></g>
<g data-edge="transfer"><polyline points="468,706 721.0,706.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="732,706 721,701 721,711" fill="#526782"/></g>
<g data-edge-label="true"><rect x="510" y="657" width="180" height="29" rx="5" fill="#f5f8fc"/>
<text x="600.0" y="677" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" fill="#526782" font-weight="400">SPI2 位置事件</text>
</g>
<path d="M52 804 H1148" fill="none" stroke="#d6e0ed"/>
<text x="52" y="832" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">采集循环末尾另有 2 ms 延时；通信、显示和中断处理也占用时间。</text>
<text x="52" y="861" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">源码问题另见代码核对记录；此图只整理现有处理链。</text>
</svg>